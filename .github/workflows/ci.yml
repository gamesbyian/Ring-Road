name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run browser:smoke
      - name: Upload visual smoke captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ring-road-visual-smoke
          path: artifacts/screenshots
          if-no-files-found: ignore
          retention-days: 7
