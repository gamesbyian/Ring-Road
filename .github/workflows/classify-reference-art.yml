name: Classify Uploaded Reference Art

on:
  push:
    branches: [assets/identify-and-build-painted-art]
    paths:
      - '.github/workflows/classify-reference-art.yml'
      - 'tools/audit-uploaded-art.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read image metadata and produce bounded previews
        run: |
          python3 -m pip install --quiet Pillow
          python3 tools/audit-uploaded-art.py
