name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture dependency audit
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency state
        uses: actions/upload-artifact@v4
        with:
          name: dependency-state
          path: |
            package-lock.json
            npm-audit.json
      - run: npm run check
