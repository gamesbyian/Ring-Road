<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b12" />
    <meta name="description" content="Ring Road — a seven-ring exact-move alignment puzzle" />
    <title>Ring Road</title>
  </head>
  <body>
    <div id="root">
      <!-- Vite/React replaces this on first render. If GitHub temporarily
           serves unbuilt source or JS crashes before mount, don't show a
           completely white page with no explanation or recovery cue. -->
      <div role="status" aria-live="polite" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;text-align:center;background:#d4e8ee;color:#283648;font:600 18px system-ui,sans-serif">
        <span style="font-size:28px;font-weight:800">Ring Road</span>
        <span>Loading the game…</span>
        <span style="font-size:14px;font-weight:400;max-width:340px">If this message stays here, the site may be updating. Please reload shortly.</span>
        <noscript>JavaScript is required to play Ring Road.</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
