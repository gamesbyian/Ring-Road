name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make Actions the only Pages deployment source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"build_type":"workflow"}'
      - run: npm ci
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Pages shell and assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          # Pages can take a few seconds to become readable after deploy completes.
          for attempt in {1..20}; do
            html="$(curl -fsSL "${PAGE_URL}?deploy=${GITHUB_SHA}" || true)"
            if [ -n "$html" ]; then
              break
            fi
            sleep 3
          done

          test -n "$html"
          echo "$html" | grep -q '/Ring-Road/assets/'
          if echo "$html" | grep -q '/src/main.tsx'; then
            echo "ERROR: Pages is serving repository source instead of the Vite build." >&2
            exit 1
          fi

          js_path="$(printf '%s' "$html" | sed -n 's/.*src="\([^"]*assets\/index-[^"]*\.js\)".*/\1/p' | head -n 1)"
          css_path="$(printf '%s' "$html" | sed -n 's/.*href="\([^"]*assets\/index-[^"]*\.css\)".*/\1/p' | head -n 1)"
          test -n "$js_path"
          test -n "$css_path"

          origin="$(printf '%s' "$PAGE_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
          curl -fsSI "$origin$js_path" >/dev/null
          curl -fsSI "$origin$css_path" >/dev/null
          echo "Live Pages verification passed: built Vite shell and assets are being served."
