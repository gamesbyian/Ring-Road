<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 220">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7e5bf"/><stop offset=".58" stop-color="#d7b17a"/><stop offset="1" stop-color="#9a7048"/>
    </linearGradient>
    <linearGradient id="stoneSide" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a9784c"/><stop offset=".5" stop-color="#c69c69"/><stop offset="1" stop-color="#80583a"/>
