name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/prepare-android.mjs'
      - 'scripts/check-android-bundle.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/prepare-android.mjs'
      - 'scripts/check-android-bundle.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

# Releases are first-class repository downloads, not committed binaries.
# Only a verified build on main publishes the rolling APK; PR runs never publish.
permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install pinned JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate production app
        run: npm run check
      - name: Build native-relative web assets
        run: npm run build:android
      - name: Prepare/sync native Android project
        run: npm run android:prepare
      - name: Verify offline bundle and native activity
        run: node scripts/check-android-bundle.mjs
      - name: Install Android API and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK identity, native signature and offline assets
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.gamesbyian.ringroad'"
          unzip -Z1 "$APK" | grep -F "assets/public/reference-skin/manifest.json"
          sha256sum "$APK"
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ring-road-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # GitHub Actions artifacts are expiring ZIP archives behind the Actions
      # interface. Releases provide an actual stable direct .apk download URL.
      # Keep this out of Git history and publish only a verified main build.
      - name: Publish directly downloadable APK to repository Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SUM="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          TAG="android-latest"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Ring Road for Android (latest test build)" \
              --prerelease \
              --notes "Automatically published sideload test builds. See docs/android.md for device acceptance status."
          fi
          # Use the same stable asset name every time: existing bookmark links
          # still resolve to the most recent successful main APK.
          gh release upload "$TAG" "$APK#ring-road.apk" --clobber
          gh release edit "$TAG" --notes "$(printf \
            'Painted-only Android debug APK.\n\nBuilt from commit: %s\nWorkflow: %s\nSHA-256 (ring-road.apk): %s\n\nTest build for sideloading, not Play Store distribution. Physical Pixel 6 Pro validation remains separate.\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$SUM")"
          # Verify that GitHub actually lists the file before claiming a
          # successful publication.
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "ring-road.apk"
          echo "Direct APK: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/ring-road.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $SUM" >> "$GITHUB_STEP_SUMMARY"

