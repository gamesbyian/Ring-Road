name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run browser:smoke
      - name: Capture painted reference at phone sizes
        run: npm run visual:audit -- --skin painted --strict --out artifacts/painted-viewport
      - name: Compare native-ratio painted image to supplied landscape reference
        run: |
          python3 -m pip install --quiet Pillow
          python3 -m unittest discover -s scripts -p "test_visual_reference_*.py"
          python3 scripts/visual-reference-compare.py \
            --reference docs/assets/reference-play-1536x864.jpg \
            --actual artifacts/painted-viewport/game-painted-1536x864.png \
            --regions docs/reference-landscape-regions.json \
            --out artifacts/painted-viewport/reference-diff \
            --mode native \
            --max-rgb-mae 45
          python3 scripts/painted-pose-review.py \
            --capture-dir artifacts/painted-viewport \
            --reference docs/assets/reference-play-1536x864.jpg \
            --out artifacts/painted-viewport/reference-diff/board-multipose-contact.png
      - name: Verify painted violet center is not sandstone
        run: python3 scripts/check-painted-medallion.py artifacts/painted-viewport/game-painted-1536x864.png
      - name: Verify all seven pigments survive actual ring interactions
        run: |
          for pose in "" "-red-one-step" "-exact-aligned-pre-fire"; do
            python3 scripts/check-painted-ring-pigments.py "artifacts/painted-viewport/game-painted-1536x864${pose}.png"
          done
      - name: Exercise painted phone compositor with SwiftShader
        run: npm run visual:audit -- --skin painted --strict --compositor swiftshader --out artifacts/painted-swiftshader
      - name: Verify ring pigments before and after SwiftShader composited moves
        run: |
          for pose in "" "-red-one-step" "-exact-aligned-pre-fire"; do
            python3 scripts/check-painted-ring-pigments.py "artifacts/painted-swiftshader/game-painted-1536x864${pose}.png"
          done
      - name: Retain SwiftShader compositor captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ring-road-painted-swiftshader
          path: artifacts/painted-swiftshader
          if-no-files-found: warn
          retention-days: 7
      - name: Upload painted scene captures and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ring-road-painted-visual-matrix
          path: artifacts/painted-viewport
          if-no-files-found: warn
          retention-days: 7
      - name: Upload visual smoke captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ring-road-visual-smoke
          path: artifacts/screenshots
          if-no-files-found: ignore
          retention-days: 7
