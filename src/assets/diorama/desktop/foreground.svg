      <stop stop-color="#f2d9a6"/><stop offset=".58" stop-color="#c89b63"/><stop offset="1" stop-color="#805b39"/>
    </linearGradient>
    <linearGradient id="stoneSide" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8f653f"/><stop offset=".5" stop-color="#b98552"/><stop offset="1" stop-color="#6f4b31"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
