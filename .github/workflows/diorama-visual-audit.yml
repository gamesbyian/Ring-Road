name: Diorama Visual Audit

on:
  pull_request:
    branches: [main]

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/capture-diorama-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: diorama-audit-screenshots
          path: |
            artifacts/diorama-audit/*.png
            docs/3d-ring-renderer-concept.jpg
          if-no-files-found: error
